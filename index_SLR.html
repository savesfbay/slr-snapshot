<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Bay Area Sea Level Rise & Flood Preparedness</title>
<meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link href="SLR_map_popup.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.18.1/mapbox-gl.js"></script> 
<style>
      body { 
        margin: 0; 
        padding: 0; 
      }
      #map { 
        position: absolute; 
        top: 0; 
        bottom: 0; 
        width: 100%; 
      }
    </style>
</head>
<body>
<div id="map"></div>
<script>
    mapboxgl.accessToken = 'pk.eyJ1Ijoic2F2ZXNmYmF5IiwiYSI6ImNra3JnamVwOTNkcW0zMnBkZDlxOXJjdmEifQ.XN_nfl_JbmkIyACF2wNX6Q';
    const assetUrl = (path) => new URL(path, window.location.href).href;
    const map = new mapboxgl.Map({
        container: 'map',
        // Choose from Mapbox's core styles, or make your own style with Mapbox Studio
        style: 'mapbox://styles/savesfbay/cmj68iadl00dn01sl0hus3kem',
        center: [-122.179, 37.750],
        zoom: 8.83
    });
    const citySnapshotsLayerId = 'slr-city-snapshots';
    const citySnapshotTextLayerId = 'slr-city-snapshots-text';
    const popupViewportPadding = 32;
    const popupHorizontalClearance = 24;
    const popupVerticalClearance = 18;
    const estimatedPopupWidth = 520;
    const estimatedPopupHeight = 420;

    function normalizeSnapshotData(data) {
      return {
        ...data,
        features: data.features.map((feature) => {
          const rawType = feature.properties?.snapshotType || feature.properties?.type || feature.type || '';
          const snapshotType = rawType.toLowerCase() === 'county' ? 'county' : 'city';

          return {
            ...feature,
            type: 'Feature',
            properties: {
              ...feature.properties,
              snapshotType
            }
          };
        })
      };
    }

    function loadMapImage(id, path) {
      return new Promise((resolve, reject) => {
        map.loadImage(assetUrl(path), (error, image) => {
          if (error) {
            reject(error);
            return;
          }
          if (!map.hasImage(id)) {
            map.addImage(id, image);
          }
          resolve();
        });
      });
    }

    function addCitySnapshotLayers(useCustomIcon) {
      if (map.getLayer(citySnapshotsLayerId)) {
        return;
      }

      if (useCustomIcon) {
        map.addLayer({
          id: citySnapshotsLayerId,
          type: 'symbol',
          source: 'slr-city-snapshots-source',
          layout: {
            'icon-image': [
              'case',
              ['==', ['get', 'snapshotType'], 'county'],
              'county-pin',
              'city-pin'
            ],
            'icon-size': [
              'case',
              ['==', ['get', 'snapshotType'], 'county'],
              0.134,
              0.28
            ],
            'icon-anchor': 'bottom',
            'icon-allow-overlap': true
          }
        });
      } else {
        map.addLayer({
          id: citySnapshotsLayerId,
          type: 'circle',
          source: 'slr-city-snapshots-source',
          paint: {
            'circle-radius': 7,
            'circle-color': '#0071ce',
            'circle-stroke-color': '#ffffff',
            'circle-stroke-width': 2
          }
        });
      }

      map.addLayer({
        id: citySnapshotTextLayerId,
        type: 'symbol',
        source: 'slr-city-snapshots-source',
        layout: {
          'text-field': ['get', 'title'],
          'text-font': ['Open Sans Semibold', 'Arial Unicode MS Bold'],
          'text-size': 13,
          'text-offset': [0.9, -1.2],
          'text-anchor': 'left',
          'text-optional': false
        },
        paint: {
          'text-color': '#0f172a',
          'text-halo-color': '#ffffff',
          'text-halo-width': 1.25
        }
      });
    }

    function getPopupPlacement(point) {
      const container = map.getContainer();
      const mapWidth = container.clientWidth;
      const mapHeight = container.clientHeight;
      const leftSpace = point.x - popupViewportPadding;
      const rightSpace = mapWidth - point.x - popupViewportPadding;
      const topSpace = point.y - popupViewportPadding;
      const bottomSpace = mapHeight - point.y - popupViewportPadding;
      const canFitRight = rightSpace >= estimatedPopupWidth + popupHorizontalClearance;
      const canFitLeft = leftSpace >= estimatedPopupWidth + popupHorizontalClearance;
      const canFitAbove = topSpace >= estimatedPopupHeight + popupVerticalClearance;
      const canFitBelow = bottomSpace >= estimatedPopupHeight + popupVerticalClearance;

      if (canFitRight) {
        if (canFitAbove) {
          return { anchor: 'bottom-left', offset: [20, -10] };
        }
        if (canFitBelow) {
          return { anchor: 'top-left', offset: [20, 10] };
        }
        return { anchor: 'left', offset: [20, 0] };
      }

      if (canFitLeft) {
        if (canFitAbove) {
          return { anchor: 'bottom-right', offset: [-20, -10] };
        }
        if (canFitBelow) {
          return { anchor: 'top-right', offset: [-20, 10] };
        }
        return { anchor: 'right', offset: [-20, 0] };
      }

      if (bottomSpace > topSpace) {
        return {
          anchor: rightSpace >= leftSpace ? 'top-left' : 'top-right',
          offset: rightSpace >= leftSpace ? [18, 10] : [-18, 10]
        };
      }

      return {
        anchor: rightSpace >= leftSpace ? 'bottom-left' : 'bottom-right',
        offset: rightSpace >= leftSpace ? [18, -10] : [-18, -10]
      };
    }

    map.on('load', async () => {
      try {
        const response = await fetch(assetUrl('SLR_city-snapshots.geojson'));
        const snapshotData = normalizeSnapshotData(await response.json());

        map.addSource('slr-city-snapshots-source', {
          type: 'geojson',
          data: snapshotData
        });

        await Promise.all([
          loadMapImage('city-pin', 'map-pin-1.png'),
          loadMapImage('county-pin', 'map-pin-2.png')
        ]);
        addCitySnapshotLayers(true);
      } catch (error) {
        console.error('Failed to load city snapshot markers:', error);
        if (!map.getSource('slr-city-snapshots-source')) {
          map.addSource('slr-city-snapshots-source', {
            type: 'geojson',
            data: assetUrl('SLR_city-snapshots.geojson')
          });
        }
        addCitySnapshotLayers(false);
      }
    });
    /* 
    Add an event listener that runs
    when a user clicks on the map element.
    */
    map.on('click', (event) => {
      // If the user clicked on one of your markers, get its information.
      const features = map.queryRenderedFeatures(event.point, {
        layers: [citySnapshotsLayerId]
      });
      if (!features.length) {
        return;
      }
      const feature = features[0];
      const popupPlacement = getPopupPlacement(event.point);

      /* 
      Create a popup, specify its options 
      and properties, and add it to the map.
      */
      const popup = new mapboxgl.Popup({
        anchor: popupPlacement.anchor,
        offset: popupPlacement.offset,
        maxWidth: '520px'
      })
        .setLngLat(feature.geometry.coordinates)
        .setHTML(
          `<h1>${feature.properties.title}</h1><p style="float:right;"><a href="${feature.properties.link}" target="_blank">Full Snapshot →</a></p><h2>At a Glance</h2><p>${feature.properties.description}</p><p><a href="${feature.properties.link}" target="_blank">Download our full evaluation of ${feature.properties.title}.</a></p>`
        )
        .addTo(map);
      });

    </script>
  </body>
</html>
